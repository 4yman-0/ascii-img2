[package]
name = "ascii-img2-cli"
description = "ASCII image generation CLI."
version = "0.1.0"
edition = "2018"
keywords = [
	"asciiart",
	"ascii-art",
	"ascii_art",
	"ascii-art-generator",
]
license = "MIT OR Apache-2.0"
readme = "../README.md"
authors = [ "4yman-0" ]
documentation = "https://docs.rs/ascii-img2-cli"
repository = "https://github.com/4yman-0/ascii-img2"

[dependencies]
ascii-img2 = { version = "0.1.0", path = "../lib", features = [ "rayon" ] }
clap = { version = "4.5.54", features = ["derive"] }
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
